name: Build x86

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: cragson/ci-workflows/.github/workflows/msbuild-windows.yml@master
    with:
      solution: mw3-surviv0r.sln
      platform: x86
      configuration: Release
      use_dxsdk_june_2010: true
      artifact_name: mw3-surviv0r-x86
      submodules: true

  release:
    name: Create GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (needed for gh metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mw3-surviv0r-x86
          path: dist

      - name: Show downloaded files (debug)
        run: |
          echo "Downloaded artifact contents:"
          find dist -maxdepth 6 -type f -print

      - name: Create Release + upload EXE(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          mapfile -t exes < <(find dist -type f -name "*.exe")
          if [ "${#exes[@]}" -eq 0 ]; then
            echo "No .exe files found under dist/"
            exit 1
          fi

          echo "EXEs to upload:"
          printf '%s\n' "${exes[@]}"

          gh release create "$tag" "${exes[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Automated x86 build from GitHub Actions."
